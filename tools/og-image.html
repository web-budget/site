<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>og-image · webBudget</title>
    <!-- Fonte da imagem public/assets/og-image.png (1200×630). Veja o README para regerar. -->
    <link rel="stylesheet" href="../public/styles.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--background);
        color: var(--foreground);
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 53px,
          var(--pauta) 53px,
          var(--pauta) 54px
        );
        background-position: 0 14px;
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 56px;
        border-left: 2px solid var(--expense);
        opacity: 0.35;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .brand svg {
        width: 72px;
        height: 72px;
      }

      .brand .name {
        font-size: 56px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .brand .name b {
        font-weight: 700;
        color: var(--primary);
      }

      h1 {
        align-self: center;
        font-size: 112px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
        max-width: 1000px;
      }

      .foot {
        display: flex;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: 26px;
        color: var(--muted-foreground);
      }

      .rule {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 118px;
        height: 8px;
        border-top: 2px solid var(--foreground);
        border-bottom: 2px solid var(--foreground);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect fill="var(--primary)" width="32" height="32" rx="3" />

          <rect fill="var(--highlight)" x="6.5" y="22.5" width="19" height="3.2" />
        </svg>
        <span class="name">web<b>Budget</b></span>
      </div>
      <h1>Suas finanças, <span class="marker">período a período.</span></h1>

</html>
